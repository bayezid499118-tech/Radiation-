<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Sign Up - Radiation</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1565c0, #42a5f5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .signup-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    .signup-box h1 {
      text-align: center;
      color: #1565c0;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      margin-bottom: 18px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #1565c0;
    }

    .group-box {
      display: none;
    }

    .signup-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #2e7d32;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup-btn:hover {
      background: #1b5e20;
    }

    .signup-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #1565c0;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <h1>Student Sign Up</h1>

    <p class="subtitle">
      Create your Radiation student account
    </p>

    <form id="signupForm">

      <label for="name">Student Name</label>

      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="studentClass">Select Class</label>

      <select id="studentClass" required>

        <option value="">
          -- Select Class --
        </option>

        <option value="8">Class 8</option>
        <option value="9">Class 9</option>
        <option value="10">Class 10</option>
        <option value="11">Class 11</option>
        <option value="12">Class 12</option>

      </select>

      <div class="group-box" id="groupBox">

        <label for="group">Select Group</label>

        <select id="group">

          <option value="">
            -- Select Group --
          </option>

          <option value="Science">
            Science
          </option>

          <option value="Arts">
            Arts
          </option>

          <option value="Commerce">
            Commerce
          </option>

        </select>

      </div>

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <label for="confirmPassword">Confirm Password</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Re-enter password"
        required
      >

      <button
        type="submit"
        class="signup-btn"
        id="signupBtn"
      >
        Create Student Account
      </button>

    </form>

    <p id="message"></p>

    <div class="login-link">

      Already have an account?

      <a href="student-login.html">
        Student Login
      </a>

    </div>

  </div>


  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://yzgydftfucahiorefgoc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_KlqB07d1lFBHtaSf3dhCCg_XczOecCS";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // ELEMENTS
    // ==========================================

    const studentClass =
      document.getElementById("studentClass");

    const groupBox =
      document.getElementById("groupBox");

    const group =
      document.getElementById("group");

    const form =
      document.getElementById("signupForm");

    const message =
      document.getElementById("message");

    const signupBtn =
      document.getElementById("signupBtn");


    // ==========================================
    // CLASS CHANGE
    // ==========================================

    studentClass.addEventListener(
      "change",
      function () {

        const selectedClass =
          studentClass.value;


        // Class 8
        if (selectedClass === "8") {

          groupBox.style.display = "none";

          group.value = "";

          group.removeAttribute("required");

        }

        // Class 9-12
        else if (
          selectedClass === "9" ||
          selectedClass === "10" ||
          selectedClass === "11" ||
          selectedClass === "12"
        ) {

          groupBox.style.display = "block";

          group.setAttribute(
            "required",
            "required"
          );

        }

        else {

          groupBox.style.display = "none";

          group.value = "";

          group.removeAttribute("required");

        }

      }
    );


    // ==========================================
    // SIGN UP
    // ==========================================

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        const name =
          document.getElementById("name")
          .value
          .trim();

        const email =
          document.getElementById("email")
          .value
          .trim();

        const password =
          document.getElementById("password")
          .value;

        const confirmPassword =
          document.getElementById("confirmPassword")
          .value;

        const selectedClass =
          studentClass.value;

        const selectedGroup =
          group.value;


        // ==========================================
        // PASSWORD CHECK
        // ==========================================

        if (password !== confirmPassword) {

          message.style.color = "red";

          message.textContent =
            "Passwords do not match.";

          return;
        }


        // ==========================================
        // CLASS CHECK
        // ==========================================

        if (!selectedClass) {

          message.style.color = "red";

          message.textContent =
            "Please select your class.";

          return;
        }


        // ==========================================
        // GROUP CHECK
        // ==========================================

        if (
          selectedClass !== "8" &&
          !selectedGroup
        ) {

          message.style.color = "red";

          message.textContent =
            "Please select your group.";

          return;
        }


        // ==========================================
        // LOADING
        // ==========================================

        signupBtn.disabled = true;

        signupBtn.textContent =
          "Creating Account...";

        message.style.color = "#1565c0";

        message.textContent =
          "Please wait...";


        // ==========================================
        // SUPABASE AUTH SIGN UP
        // ==========================================

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {

                full_name: name,

                student_class: selectedClass,

                student_group:
                  selectedClass === "8"
                    ? null
                    : selectedGroup,

                role: "student"

              }

            }

          });


        // ==========================================
        // AUTH ERROR
        // ==========================================

        if (error) {

          signupBtn.disabled = false;

          signupBtn.textContent =
            "Create Student Account";

          message.style.color = "red";

          message.textContent =
            error.message;

          return;
        }


        // ==========================================
        // CHECK USER
        // ==========================================

        if (!data.user) {

          signupBtn.disabled = false;

          signupBtn.textContent =
            "Create Student Account";

          message.style.color = "red";

          message.textContent =
            "Account could not be created.";

          return;
        }


        // ==========================================
        // SAVE STUDENT IN PROFILES TABLE
        // ==========================================

        const { error: profileError } =
          await supabaseClient
          .from("profiles")
          .insert({

            id: data.user.id,

            full_name: name,

            email: email,

            role: "student",

            student_class: selectedClass,

            student_group:
              selectedClass === "8"
                ? null
                : selectedGroup,

            is_active: true

          });


        // ==========================================
        // PROFILE ERROR
        // ==========================================

        if (profileError) {

          console.error(
            "Profile Error:",
            profileError
          );

          message.style.color = "red";

          message.textContent =
            "Account created, but student profile could not be saved.";

          signupBtn.disabled = false;

          signupBtn.textContent =
            "Create Student Account";

          return;
        }


        // ==========================================
        // SUCCESS
        // ==========================================

        message.style.color = "green";

        message.textContent =
          "Student account created successfully!";


        console.log(
          "Student Account:",
          data.user
        );


        // ==========================================
        // GO TO DASHBOARD
        // ==========================================

        setTimeout(
          function () {

            window.location.href =
              "student-dashboard.html";

          },
          1000
        );

      }
    );

  </script>

</body>
</html>
