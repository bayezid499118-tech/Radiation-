<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Sign Up - Radiation</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1565c0, #42a5f5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .signup-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    .signup-box h1 {
      text-align: center;
      color: #1565c0;
      margin-bottom: 8px;
    }

    .signup-box .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      margin-bottom: 18px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1565c0;
    }

    .signup-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #2e7d32;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup-btn:hover {
      background: #1b5e20;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #1565c0;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <h1>Student Sign Up</h1>

    <p class="subtitle">
      Create your Radiation student account
    </p>

    <form id="signupForm">

      <label for="phone">Mobile Number</label>

      <input
        type="tel"
        id="phone"
        placeholder="01XXXXXXXXX"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <label for="confirmPassword">Confirm Password</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Re-enter password"
        required
      >

      <button type="submit" class="signup-btn">
        Create Student Account
      </button>

    </form>

    <p id="message"></p>

    <div class="login-link">
      Already have an account?
      <a href="student-login.html">Student Login</a>
    </div>

  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");

      if (password !== confirmPassword) {
        message.style.color = "red";
        message.textContent = "Passwords do not match.";
        return;
      }

      message.style.color = "#1565c0";
      message.textContent = "Sign-up system will be connected to Supabase next.";

      console.log("Phone:", phone);
    });
  </script>

</body>
  </html>
