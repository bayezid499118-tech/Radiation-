<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Class - Radiation</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #222;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    .live-status {
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-size: 18px;
      margin-bottom: 15px;
      background: #fee2e2;
      color: #b91c1c;
      font-weight: bold;
    }

    .join-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      background: #16a34a;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
    }

    .join-btn:hover {
      background: #15803d;
    }

    .no-live {
      text-align: center;
      color: #666;
      padding: 20px;
    }

    #messages {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      background: #f8fafc;
      margin-bottom: 10px;
    }

    .message {
      background: white;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      border-left: 4px solid #2563eb;
    }

    .student-name {
      font-weight: bold;
      color: #2563eb;
    }

    .time {
      font-size: 11px;
      color: #888;
      margin-left: 5px;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 80px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: none;
      font-size: 15px;
    }

    .send-btn {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .back-btn {
      display: block;
      text-align: center;
      background: #374151;
      color: white;
      padding: 13px;
      border-radius: 10px;
      text-decoration: none;
      margin-top: 20px;
    }

    .loading {
      text-align: center;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Radiation</h1>
    <p>Live Class</p>
  </div>

  <div class="container">

    <!-- LIVE CLASS -->
    <div class="card">

      <h2 id="classTitle">Live Class</h2>

      <div id="liveStatus" class="loading">
        Live Class খোঁজা হচ্ছে...
      </div>

      <div id="meetArea"></div>

    </div>


    <!-- CHAT -->
    <div class="card">

      <h2>💬 Live Class Chat</h2>

      <div id="messages">
        <div class="loading">মেসেজ লোড হচ্ছে...</div>
      </div>

      <textarea
        id="messageInput"
        placeholder="আপনার প্রশ্ন এখানে লিখুন..."
      ></textarea>

      <button class="send-btn" onclick="sendMessage()">
        Send Question
      </button>

    </div>


    <a href="mathematics.html" class="back-btn">
      ← Mathematics এ ফিরে যান
    </a>

  </div>


<script>

  /* ==============================
     SUPABASE
  ============================== */

  const SUPABASE_URL =
    "https://yzgydftfucahiorefgoc.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_KlqB07d1lFBHtaSf3dhCCg_XczOecCS";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==============================
     URL DATA
  ============================== */

  const params = new URLSearchParams(
    window.location.search
  );

  const subjectFromURL =
    params.get("subject") || "Mathematics";

  const chapter =
    parseInt(params.get("chapter")) || 1;


  /* ==============================
     SUBJECT
  ============================== */

  // Website-এর Mathematics এবং
  // Teacher Dashboard-এর গণিত একই subject
  let databaseSubject = subjectFromURL;

  if (
    subjectFromURL === "Mathematics" ||
    subjectFromURL === "গণিত"
  ) {
    databaseSubject = "গণিত";
  }


  /* ==============================
     STUDENT DATA
  ============================== */

  let currentUser = null;
  let studentName = "";
  let studentClass = "";
  let studentGroup = null;


  /* ==============================
     LOAD STUDENT
  ============================== */

  async function loadStudent() {

    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {

      window.location.href =
        "student-login.html";

      return false;
    }

    currentUser = user;

    studentName =
      user.user_metadata?.full_name ||
      "Student";

    studentClass =
      String(
        user.user_metadata?.student_class || ""
      );

    studentGroup =
      user.user_metadata?.student_group || null;

    return true;
  }


  /* ==============================
     LOAD LIVE CLASS
  ============================== */

  async function loadLiveClass() {

    document.getElementById("classTitle").innerText =
      "Class " + studentClass +
      " — " + databaseSubject +
      " — Chapter " + chapter;


    let query =
      supabaseClient
        .from("live_classes")
        .select("*")
        .eq("class_name", studentClass)
        .eq("subject", databaseSubject)
        .eq("chapter", chapter)
        .order("created_at", {
          ascending: false
        })
        .limit(1);


    // Class 9-12 হলে Group-ও মিলবে
    if (studentClass !== "8" && studentGroup) {

      query = query.eq(
        "group_name",
        studentGroup
      );

    }


    const {
      data,
      error
    } = await query;


    const status =
      document.getElementById("liveStatus");

    const meetArea =
      document.getElementById("meetArea");


    if (error) {

      console.error(error);

      status.innerText =
        "Live Class লোড করতে সমস্যা হয়েছে।";

      status.style.background = "#fee2e2";
      status.style.color = "#b91c1c";

      return;
    }


    if (!data || data.length === 0) {

      status.innerText =
        "🔴 এই Chapter-এর Live Class এখনো শুরু হয়নি।";

      status.style.background = "#fef3c7";
      status.style.color = "#92400e";

      meetArea.innerHTML = "";

      return;
    }


    const liveClass = data[0];


    status.innerText =
      "🔴 LIVE — Class " +
      studentClass +
      " — " +
      databaseSubject +
      " — Chapter " +
      chapter;

    status.style.background = "#dcfce7";
    status.style.color = "#166534";


    meetArea.innerHTML = `

      <a
        href="${liveClass.meet_link}"
        target="_blank"
        rel="noopener noreferrer"
        class="join-btn"
      >
        🎥 Join Live Class
      </a>

    `;

  }


  /* ==============================
     LOAD CHAT
  ============================== */

  async function loadMessages() {

    const {
      data,
      error
    } = await supabaseClient
      .from("live_chat_messages")
      .select("*")
      .eq("subject", subjectFromURL)
      .eq("chapter", chapter)
      .order("created_at", {
        ascending: true
      });


    const messages =
      document.getElementById("messages");


    if (error) {

      console.error(error);

      messages.innerHTML =
        "<p>Chat লোড করা যায়নি।</p>";

      return;
    }


    if (!data || data.length === 0) {

      messages.innerHTML =
        "<p style='text-align:center;color:#777;'>এখনো কোনো প্রশ্ন নেই।</p>";

      return;
    }


    messages.innerHTML = "";


    data.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "message";


      const time =
        new Date(item.created_at)
          .toLocaleTimeString(
            "bn-BD",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );


      div.innerHTML = `

        <span class="student-name">
          ${escapeHTML(item.student_name)}
        </span>

        <span class="time">
          ${time}
        </span>

        <br>

        <span>
          ${escapeHTML(item.message)}
        </span>

      `;


      messages.appendChild(div);

    });


    messages.scrollTop =
      messages.scrollHeight;

  }


  /* ==============================
     SEND MESSAGE
  ============================== */

  async function sendMessage() {

    const input =
      document.getElementById(
        "messageInput"
      );

    const message =
      input.value.trim();


    if (!message) {

      alert("প্রথমে প্রশ্ন লিখুন।");

      return;
    }


    const {
      error
    } = await supabaseClient
      .from("live_chat_messages")
      .insert({

        subject: subjectFromURL,

        chapter: chapter,

        student_name: studentName,

        message: message

      });


    if (error) {

      console.error(error);

      alert(
        "প্রশ্ন পাঠানো যায়নি। আবার চেষ্টা করুন।"
      );

      return;
    }


    input.value = "";

    await loadMessages();

  }


  /* ==============================
     ENTER KEY
  ============================== */

  document
    .getElementById("messageInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


  /* ==============================
     HTML SECURITY
  ============================== */

  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  /* ==============================
     START
  ============================== */

  async function startPage() {

    const loggedIn =
      await loadStudent();

    if (!loggedIn) return;


    await loadLiveClass();

    await loadMessages();


    // প্রতি 5 সেকেন্ডে Chat refresh
    setInterval(
      loadMessages,
      5000
    );


    // প্রতি 10 সেকেন্ডে Live Class refresh
    setInterval(
      loadLiveClass,
      10000
    );

  }


  startPage();

</script>

</body>
</html>
