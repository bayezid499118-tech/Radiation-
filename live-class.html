<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Class - Radiation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .back-btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 10px 17px;
      border-radius: 8px;
      margin-bottom: 18px;
    }

    .class-info {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }

    .class-info h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .live-status {
      display: inline-block;
      background: #dc2626;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    /* Live Video */
    .video-box {
      background: #000;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      margin-bottom: 20px;
    }

    .video-content {
      padding: 20px;
    }

    .video-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .video-content h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .video-content p {
      margin: 0;
      color: #ccc;
      font-size: 14px;
    }

    /* Chat */
    .chat-box {
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .chat-header {
      background: #111827;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .messages {
      height: 300px;
      overflow-y: auto;
      padding: 15px;
      background: #f9fafb;
    }

    .message {
      background: white;
      padding: 10px 12px;
      border-radius: 9px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .message-name {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .message-text {
      font-size: 14px;
      color: #444;
    }

    .empty-message {
      text-align: center;
      color: #888;
      padding-top: 100px;
      font-size: 14px;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e5e7eb;
    }

    .chat-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .send-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .send-btn:hover {
      background: #1d4ed8;
    }

    @media (max-width: 600px) {

      .header h1 {
        font-size: 21px;
      }

      .class-info h2 {
        font-size: 18px;
      }

      .messages {
        height: 250px;
      }

      .chat-input-area {
        padding: 10px;
      }

      .send-btn {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <h1>Radiation</h1>
    <p id="subjectName">Mathematics</p>
  </div>


  <div class="container">

    <!-- Back -->
    <a href="#" class="back-btn" id="backButton">
      ← Back to Chapter
    </a>


    <!-- Class Information -->
    <div class="class-info">

      <h2 id="chapterTitle">
        Live Class
      </h2>

      <span class="live-status">
        ● LIVE
      </span>

    </div>


    <!-- Live Video -->
    <div class="video-box">

      <div class="video-content">

        <div class="video-icon">
          ▶
        </div>

        <h3>Live Class Video</h3>

        <p>
          শিক্ষক লাইভ ক্লাস শুরু করলে এখানে ভিডিও দেখা যাবে।
        </p>

      </div>

    </div>


    <!-- Chat -->
    <div class="chat-box">

      <div class="chat-header">
        💬 Live Class Chat
      </div>


      <!-- Messages -->
      <div class="messages" id="messages">

        <div class="empty-message" id="emptyMessage">
          এখনো কোনো মন্তব্য নেই।
        </div>

      </div>


      <!-- Input -->
      <div class="chat-input-area">

        <input
          type="text"
          id="chatInput"
          class="chat-input"
          placeholder="আপনার মন্তব্য লিখুন..."
          maxlength="300"
        >

        <button
          class="send-btn"
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

    </div>

  </div>


  <script>

    // URL থেকে Subject ও Chapter নেওয়া

    const urlParams =
      new URLSearchParams(window.location.search);

    const subject =
      urlParams.get("subject") || "Mathematics";

    const chapter =
      urlParams.get("chapter") || "1";


    // Mathematics-এর অধ্যায়ের নাম

    const mathematicsChapters = {

      1: "প্যাটার্ন",
      2: "মুনাফা",
      3: "পরিমাপ",
      4: "বীজগণিতীয় সূত্রাবলি ও প্রয়োগ",
      5: "বীজগণিতীয় ভগ্নাংশ",
      6: "সরল সহসমীকরণ",
      7: "সেট",
      8: "চতুর্ভুজ",
      9: "পিথাগোরাসের উপপাদ্য",
      10: "বৃত্ত",
      11: "তথ্য ও উপাত্ত"

    };


    let chapterName =
      "অধ্যায় " + chapter;


    if (
      subject === "Mathematics" &&
      mathematicsChapters[chapter]
    ) {

      chapterName =
        mathematicsChapters[chapter];

    }


    // Subject দেখানো

    document.getElementById("subjectName").innerText =
      subject;


    // Chapter দেখানো

    document.getElementById("chapterTitle").innerText =
      "অধ্যায় " + chapter +
      " — " + chapterName;


    // Back Button

    document.getElementById("backButton").href =
      "chapter.html?subject=" +
      encodeURIComponent(subject) +
      "&chapter=" +
      encodeURIComponent(chapter);


    // Comment পাঠানো

    function sendMessage() {

      const input =
        document.getElementById("chatInput");

      const message =
        input.value.trim();


      if (message === "") {

        return;

      }


      const messages =
        document.getElementById("messages");

      const emptyMessage =
        document.getElementById("emptyMessage");


      if (emptyMessage) {

        emptyMessage.remove();

      }


      const newMessage =
        document.createElement("div");

      newMessage.className =
        "message";


      newMessage.innerHTML =

        '<div class="message-name">Student</div>' +

        '<div class="message-text">' +

        escapeHTML(message) +

        '</div>';


      messages.appendChild(newMessage);


      input.value = "";


      messages.scrollTop =
        messages.scrollHeight;

    }


    // নিরাপদভাবে মন্তব্য দেখানো

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;

    }


    // Enter চাপলেও Comment পাঠানো যাবে

    document
      .getElementById("chatInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            sendMessage();

          }

        }
      );

  </script>

</body>
  </html>
