<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Class - Radiation</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .back-btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 10px 17px;
      border-radius: 8px;
      margin-bottom: 18px;
    }

    .class-info {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }

    .class-info h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .live-status {
      display: inline-block;
      background: #dc2626;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .video-box {
      background: #000;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      margin-bottom: 20px;
    }

    .video-content {
      padding: 20px;
    }

    .video-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .video-content h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .video-content p {
      margin: 0;
      color: #ccc;
      font-size: 14px;
    }

    .chat-box {
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .chat-header {
      background: #111827;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .messages {
      height: 300px;
      overflow-y: auto;
      padding: 15px;
      background: #f9fafb;
    }

    .message {
      background: white;
      padding: 10px 12px;
      border-radius: 9px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .message-name {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .message-text {
      font-size: 14px;
      color: #444;
      word-break: break-word;
    }

    .reply {
      margin-top: 8px;
      padding: 8px 10px;
      background: #eef4ff;
      border-left: 3px solid #2563eb;
      border-radius: 5px;
      font-size: 13px;
    }

    .reply-name {
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 3px;
    }

    .empty-message {
      text-align: center;
      color: #888;
      padding-top: 100px;
      font-size: 14px;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e5e7eb;
    }

    .chat-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .send-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .send-btn:hover {
      background: #1d4ed8;
    }

    .send-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {

      .header h1 {
        font-size: 21px;
      }

      .class-info h2 {
        font-size: 18px;
      }

      .messages {
        height: 250px;
      }

      .chat-input-area {
        padding: 10px;
      }

      .send-btn {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Radiation</h1>
    <p id="subjectName">Mathematics</p>
  </div>

  <div class="container">

    <a href="#" class="back-btn" id="backButton">
      ← Back to Chapter
    </a>

    <div class="class-info">

      <h2 id="chapterTitle">
        Live Class
      </h2>

      <span class="live-status">
        ● LIVE
      </span>

    </div>

    <!-- Live Video -->
    <div class="video-box">

      <div class="video-content">

        <div class="video-icon">
          ▶
        </div>

        <h3>Live Class Video</h3>

        <p>
          শিক্ষক লাইভ ক্লাস শুরু করলে এখানে ভিডিও দেখা যাবে।
        </p>

      </div>

    </div>

    <!-- Chat -->
    <div class="chat-box">

      <div class="chat-header">
        💬 Live Class Chat
      </div>

      <div class="messages" id="messages">

        <div class="empty-message" id="emptyMessage">
          মেসেজ লোড হচ্ছে...
        </div>

      </div>

      <div class="chat-input-area">

        <input
          type="text"
          id="chatInput"
          class="chat-input"
          placeholder="আপনার মন্তব্য লিখুন..."
          maxlength="300"
        >

        <button
          class="send-btn"
          id="sendButton"
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

    </div>

  </div>


  <script>

    // ==============================
    // SUPABASE CONNECTION
    // ==============================

    const SUPABASE_URL =
      "https://yzgydftfucahiorefgoc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_KlqB07d1lFBHtaSf3dhCCg_XczOecCS";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // URL DATA
    // ==============================

    const urlParams =
      new URLSearchParams(window.location.search);

    const subject =
      urlParams.get("subject") || "Mathematics";

    const chapter =
      urlParams.get("chapter") || "1";


    // ==============================
    // MATHEMATICS CHAPTERS
    // ==============================

    const mathematicsChapters = {

      1: "প্যাটার্ন",
      2: "মুনাফা",
      3: "পরিমাপ",
      4: "বীজগণিতীয় সূত্রাবলি ও প্রয়োগ",
      5: "বীজগণিতীয় ভগ্নাংশ",
      6: "সরল সহসমীকরণ",
      7: "সেট",
      8: "চতুর্ভুজ",
      9: "পিথাগোরাসের উপপাদ্য",
      10: "বৃত্ত",
      11: "তথ্য ও উপাত্ত"

    };


    let chapterName =
      "অধ্যায় " + chapter;


    if (
      subject === "Mathematics" &&
      mathematicsChapters[chapter]
    ) {

      chapterName =
        mathematicsChapters[chapter];

    }


    document.getElementById("subjectName").innerText =
      subject;


    document.getElementById("chapterTitle").innerText =
      "অধ্যায় " + chapter +
      " — " + chapterName;


    // ==============================
    // BACK BUTTON
    // ==============================

    document.getElementById("backButton").href =
      "chapter.html?subject=" +
      encodeURIComponent(subject) +
      "&chapter=" +
      encodeURIComponent(chapter);


    // ==============================
    // STUDENT NAME
    // ==============================

    let studentName = "Student";


    // ==============================
    // LOAD CURRENT USER
    // ==============================

    async function loadUser() {

      const {
        data: {
          user
        }
      } = await supabaseClient.auth.getUser();


      if (!user) {

        alert("অনুগ্রহ করে আগে Student Login করুন।");

        window.location.href =
          "student-login.html";

        return false;

      }


      studentName =
        user.user_metadata?.full_name ||
        "Student";


      return true;

    }


    // ==============================
    // LOAD CHAT MESSAGES
    // ==============================

    async function loadMessages() {

      const {
        data,
        error
      } = await supabaseClient

        .from("live_chat_messages")

        .select("*")

        .eq("subject", subject)

        .eq("chapter", parseInt(chapter))

        .order("created_at", {
          ascending: true
        });


      if (error) {

        console.error(error);

        document.getElementById("messages").innerHTML =
          '<div class="empty-message">' +
          'মেসেজ লোড করা যায়নি।' +
          '</div>';

        return;

      }


      displayMessages(data || []);

    }


    // ==============================
    // DISPLAY MESSAGES
    // ==============================

    function displayMessages(data) {

      const messages =
        document.getElementById("messages");


      messages.innerHTML = "";


      if (data.length === 0) {

        messages.innerHTML =
          '<div class="empty-message">' +
          'এখনো কোনো মন্তব্য নেই।' +
          '</div>';

        return;

      }


      data.forEach(function(item) {

        const messageDiv =
          document.createElement("div");

        messageDiv.className =
          "message";


        const nameDiv =
          document.createElement("div");

        nameDiv.className =
          "message-name";

        nameDiv.textContent =
          item.student_name;


        const textDiv =
          document.createElement("div");

        textDiv.className =
          "message-text";

        textDiv.textContent =
          item.message;


        messageDiv.appendChild(nameDiv);

        messageDiv.appendChild(textDiv);


        // Teacher Reply থাকলে দেখাবে

        if (item.teacher_reply) {

          const replyDiv =
            document.createElement("div");

          replyDiv.className =
            "reply";


          const replyName =
            document.createElement("div");

          replyName.className =
            "reply-name";

          replyName.textContent =
            "Teacher Reply";


          const replyText =
            document.createElement("div");

          replyText.textContent =
            item.teacher_reply;


          replyDiv.appendChild(replyName);

          replyDiv.appendChild(replyText);

          messageDiv.appendChild(replyDiv);

        }


        messages.appendChild(messageDiv);

      });


      messages.scrollTop =
        messages.scrollHeight;

    }


    // ==============================
    // SEND MESSAGE
    // ==============================

    async function sendMessage() {

      const input =
        document.getElementById("chatInput");

      const button =
        document.getElementById("sendButton");


      const message =
        input.value.trim();


      if (message === "") {

        return;

      }


      button.disabled = true;

      button.innerText = "Sending...";


      const {
        data: {
          user
        }
      } = await supabaseClient.auth.getUser();


      if (!user) {

        alert("অনুগ্রহ করে আগে Login করুন.");

        window.location.href =
          "student-login.html";

        return;

      }


      const name =
        user.user_metadata?.full_name ||
        "Student";


      const {
        error
      } = await supabaseClient

        .from("live_chat_messages")

        .insert({

          subject: subject,

          chapter: parseInt(chapter),

          student_name: name,

          message: message

        });


      if (error) {

        console.error(error);

        alert(
          "মেসেজ পাঠানো যায়নি। আবার চেষ্টা করুন।"
        );

      } else {

        input.value = "";

        await loadMessages();

      }


      button.disabled = false;

      button.innerText = "Send";

    }


    // ==============================
    // ENTER KEY
    // ==============================

    document
      .getElementById("chatInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            sendMessage();

          }

        }
      );


    // ==============================
    // START
    // ==============================

    async function startPage() {

      const loggedIn =
        await loadUser();


      if (!loggedIn) {

        return;

      }


      await loadMessages();


      // প্রতি ৫ সেকেন্ডে নতুন মেসেজ/
      // Teacher Reply চেক করবে

      setInterval(
        loadMessages,
        5000
      );

    }


    startPage();

  </script>

</body>
</html>
