<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Control - Radiation</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ff;
    }

    header {
      background: #6d28d9;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .top-box {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .student {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .student h3 {
      margin: 0 0 8px;
      color: #4c1d95;
    }

    .info {
      color: #555;
      line-height: 1.7;
    }

    .status {
      font-weight: bold;
      margin: 10px 0;
    }

    .on {
      color: green;
    }

    .off {
      color: red;
    }

    button {
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      font-size: 15px;
    }

    .grant {
      background: #16a34a;
    }

    .remove {
      background: #dc2626;
    }

    .back {
      background: #6d28d9;
      margin-bottom: 20px;
    }

    #message {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h2>Radiation Owner Panel</h2>
  <p>Student Class Access Control</p>
</header>

<div class="container">

  <button class="back" onclick="goBack()">← Owner Dashboard</button>

  <div class="top-box">
    <h3>Class Access Control</h3>
    <p>
      এখানে একজন Student-এর জন্য Class Access ON করলে
      সে সব Subject-এর ক্লাস ব্যবহার করতে পারবে।
      আলাদা Subject Access প্রয়োজন হবে না।
    </p>

    <p>
      <b>Total Students:</b>
      <span id="totalStudents">0</span>
    </p>

    <div id="message"></div>
  </div>

  <div id="studentList">
    Loading...
  </div>

</div>

<script>

const SUPABASE_URL = "https://yzgydftfucahiorefgoc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_KlqB07d1lFBHtaSf3dhCCg_XczOecCS";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const OWNER_ID =
  "bde99e0b-525d-4818-b849-083f24e9e613";


async function checkOwner() {

  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();

  if (error || !user || user.id !== OWNER_ID) {
    alert("Owner access required.");
    window.location.href = "owner-login.html";
    return false;
  }

  return true;
}


async function loadStudents() {

  const list = document.getElementById("studentList");

  list.innerHTML = "Loading...";

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("role", "student")
    .order("created_at", { ascending: false });

  if (error) {

    list.innerHTML =
      "<p style='color:red;'>Students load করতে সমস্যা হয়েছে.</p>";

    console.error(error);
    return;
  }

  document.getElementById("totalStudents").textContent =
    data.length;

  if (data.length === 0) {

    list.innerHTML =
      "<div class='student'>কোনো Student পাওয়া যায়নি।</div>";

    return;
  }

  list.innerHTML = "";

  data.forEach(student => {

    const access = student.class_access === true;

    const card = document.createElement("div");

    card.className = "student";

    card.innerHTML = `

      <h3>${escapeHTML(student.full_name || "Unnamed Student")}</h3>

      <div class="info">
        <b>Email:</b>
        ${escapeHTML(student.email || "N/A")}
        <br>

        <b>Class:</b>
        ${escapeHTML(student.student_class || "N/A")}
        <br>

        <b>Group:</b>
        ${escapeHTML(student.student_group || "N/A")}
      </div>

      <div class="status ${access ? "on" : "off"}">
        Class Access:
        ${access ? "ON" : "OFF"}
      </div>

      ${
        access
        ?
        `<button
          class="remove"
          onclick="changeAccess('${student.id}', false)">
          Remove Class Access
        </button>`
        :
        `<button
          class="grant"
          onclick="changeAccess('${student.id}', true)">
          Grant Class Access
        </button>`
      }

    `;

    list.appendChild(card);

  });

}


async function changeAccess(studentId, value) {

  const message =
    document.getElementById("message");

  message.style.color = "#333";
  message.textContent = "Updating...";

  const { error } = await supabaseClient
    .from("profiles")
    .update({
      class_access: value
    })
    .eq("id", studentId);

  if (error) {

    message.style.color = "red";
    message.textContent =
      "Access update করতে সমস্যা হয়েছে.";

    console.error(error);
    return;
  }

  message.style.color = "green";

  message.textContent =
    value
    ? "Class Access দেওয়া হয়েছে।"
    : "Class Access বন্ধ করা হয়েছে।";

  await loadStudents();

}


function goBack() {
  window.location.href = "owner-dashboard.html";
}


function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


(async function () {

  const allowed = await checkOwner();

  if (allowed) {
    await loadStudents();
  }

})();

</script>

</body>
  </html>
