<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - Radiation</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1565c0, #42a5f5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }

    .login-box h1 {
      text-align: center;
      color: #1565c0;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      margin-bottom: 18px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1565c0;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #1565c0;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #0d47a1;
    }

    .login-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .signup-link {
      text-align: center;
      margin-top: 20px;
    }

    .signup-link a {
      color: #1565c0;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Student Login</h1>

    <p class="subtitle">
      Login to your Radiation student account
    </p>

    <form id="loginForm">

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        Student Login
      </button>

    </form>

    <p id="message"></p>

    <div class="signup-link">
      Don't have an account?
      <a href="student-signup.html">Create Student Account</a>
    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://yzgydftfucahiorefgoc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_KlqB07d1lFBHtaSf3dhCCg_XczOecCS";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    const loginBtn =
      document.getElementById("loginBtn");


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email")
          .value
          .trim();

        const password =
          document.getElementById("password")
          .value;


        loginBtn.disabled = true;

        loginBtn.textContent =
          "Logging in...";

        message.style.color =
          "#1565c0";

        message.textContent =
          "Please wait...";


        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          loginBtn.disabled = false;

          loginBtn.textContent =
            "Student Login";

          message.style.color =
            "red";

          message.textContent =
            error.message;

          return;
        }


        message.style.color =
          "green";

        message.textContent =
          "Login successful!";


        setTimeout(function() {

          window.location.href =
            "student-dashboard.html";

        }, 800);

      }
    );

  </script>

</body>
  </html>
