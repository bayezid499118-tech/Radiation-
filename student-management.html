<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Management - Radiation</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #6a1b9a;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 27px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px 15px;
    }

    .top-box {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .top-box h2 {
      color: #6a1b9a;
      margin-bottom: 8px;
    }

    .count {
      font-size: 18px;
      font-weight: bold;
    }

    .table-box {
      background: white;
      border-radius: 14px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th {
      background: #6a1b9a;
      color: white;
      padding: 12px;
      text-align: center;
    }

    td {
      padding: 11px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    tr:hover {
      background: #f7f1fa;
    }

    .active {
      color: green;
      font-weight: bold;
    }

    .blocked {
      color: red;
      font-weight: bold;
    }

    .btn {
      border: none;
      padding: 8px 13px;
      border-radius: 7px;
      cursor: pointer;
      color: white;
      font-size: 13px;
    }

    .block-btn {
      background: #c62828;
    }

    .block-btn:hover {
      background: #8e0000;
    }

    .unblock-btn {
      background: #2e7d32;
    }

    .unblock-btn:hover {
      background: #1b5e20;
    }

    .back-btn {
      display: block;
      width: 220px;
      margin: 25px auto 0;
      background: #6a1b9a;
      text-align: center;
      text-decoration: none;
      padding: 11px;
      border-radius: 8px;
      color: white;
    }

    .back-btn:hover {
      background: #4a148c;
    }

    .message {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>👑 Student Management</h1>
  <p>Radiation Owner Panel</p>
</header>

<div class="container">

  <div class="top-box">
    <h2>Student Management</h2>
    <div class="count">
      Total Students: <span id="studentCount">0</span>
    </div>
  </div>

  <div class="table-box">

    <table>

      <thead>
        <tr>
          <th>নাম</th>
          <th>Email</th>
          <th>Class</th>
          <th>Group</th>
          <th>Status</th>
          <th>Created</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="studentTable">

        <tr>
          <td colspan="7" class="message">
            Student data loading...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

  <a href="owner-dashboard.html" class="back-btn">
    ← Back to Owner Dashboard
  </a>

</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://yzgydftfucahiorefgoc.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_KlqB07d1lFBHtaSf3dhCCg_XczOecCS";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     OWNER ID
  ========================= */

  const OWNER_ID =
    "bde99e0b-525d-4818-b849-083f24e9e613";


  /* =========================
     OWNER CHECK
  ========================= */

  async function checkOwner() {

    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();


    if (error || !user) {

      window.location.href =
        "owner-login.html";

      return false;
    }


    if (user.id !== OWNER_ID) {

      await supabaseClient.auth.signOut();

      window.location.href =
        "owner-login.html";

      return false;
    }


    return true;
  }


  /* =========================
     LOAD STUDENTS
  ========================= */

  async function loadStudents() {

    const allowed = await checkOwner();

    if (!allowed) return;


    const {
      data,
      error
    } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("role", "student")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      document.getElementById("studentTable").innerHTML = `
        <tr>
          <td colspan="7" class="message">
            Student data load করা যায়নি।
            <br><br>
            ${error.message}
          </td>
        </tr>
      `;

      return;
    }


    document.getElementById("studentCount").textContent =
      data.length;


    const table =
      document.getElementById("studentTable");


    if (data.length === 0) {

      table.innerHTML = `
        <tr>
          <td colspan="7" class="message">
            এখনো কোনো Student profile পাওয়া যায়নি।
          </td>
        </tr>
      `;

      return;
    }


    table.innerHTML = "";


    data.forEach(student => {

      const row =
        document.createElement("tr");


      const status =
        student.is_active === false
          ? `<span class="blocked">Blocked</span>`
          : `<span class="active">Active</span>`;


      const actionButton =
        student.is_active === false

          ? `<button
               class="btn unblock-btn"
               onclick="changeStatus('${student.id}', true)">
               Unblock
             </button>`

          : `<button
               class="btn block-btn"
               onclick="changeStatus('${student.id}', false)">
               Block
             </button>`;


      const created =
        student.created_at
          ? new Date(student.created_at)
              .toLocaleDateString("en-GB")
          : "-";


      row.innerHTML = `

        <td>
          ${student.full_name || "-"}
        </td>

        <td>
          ${student.email || "-"}
        </td>

        <td>
          ${student.student_class || "-"}
        </td>

        <td>
          ${student.student_group || "-"}
        </td>

        <td>
          ${status}
        </td>

        <td>
          ${created}
        </td>

        <td>
          ${actionButton}
        </td>

      `;


      table.appendChild(row);

    });

  }


  /* =========================
     BLOCK / UNBLOCK
  ========================= */

  async function changeStatus(studentId, newStatus) {

    const allowed = await checkOwner();

    if (!allowed) return;


    const action =
      newStatus
        ? "Unblock"
        : "Block";


    const confirmed =
      confirm(
        `আপনি কি Student-কে ${action} করতে চান?`
      );


    if (!confirmed) return;


    const {
      error
    } = await supabaseClient
      .from("profiles")
      .update({
        is_active: newStatus
      })
      .eq("id", studentId);


    if (error) {

      alert(
        "Status পরিবর্তন করা যায়নি:\n" +
        error.message
      );

      return;
    }


    alert(
      newStatus
        ? "Student Unblock করা হয়েছে।"
        : "Student Block করা হয়েছে।"
    );


    loadStudents();

  }


  /* =========================
     START
  ========================= */

  loadStudents();

</script>

</body>
  </html>
