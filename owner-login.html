<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Owner Login - Radiation</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      color: #6a1b9a;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #6a1b9a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4a148c;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #1565c0;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>👑 Owner Login</h1>

    <p class="subtitle">
      Radiation Control Panel
    </p>

    <form id="ownerLoginForm">

      <label for="password">
        Owner Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Password দিন"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        Owner Login
      </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back">
      ← Home Page
    </a>

  </div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://yzgydftfucahiorefgoc.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_KlqB07d1lFBHtaSf3dhCCg_XczOecCS";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     FIXED OWNER ACCOUNT
     ========================= */

  const OWNER_EMAIL =
    "bayezid123215@gmail.com";


  /* =========================
     OWNER LOGIN
  ========================= */

  document
    .getElementById("ownerLoginForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const password =
        document
          .getElementById("password")
          .value;

      const message =
        document
          .getElementById("message");

      message.style.color = "#555";
      message.innerText =
        "Owner Login হচ্ছে...";


      /* Login with fixed Owner email */

      const {
        data,
        error
      } = await supabaseClient.auth
        .signInWithPassword({

          email: OWNER_EMAIL,

          password: password

        });


      /* Wrong password / login error */

      if (error) {

        message.style.color = "#c62828";

        message.innerText =
          "Password সঠিক নয়।";

        return;
      }


      const user = data.user;


      /* Check Owner role */

      const role =
        user.user_metadata?.role;


      if (role !== "owner") {

        await supabaseClient.auth.signOut();

        message.style.color = "#c62828";

        message.innerText =
          "এই Account Owner Account নয়।";

        return;
      }


      /* Successful login */

      message.style.color = "#2e7d32";

      message.innerText =
        "Owner Login সফল হয়েছে।";


      setTimeout(function() {

        window.location.href =
          "owner-dashboard.html";

      }, 700);

    });

</script>

</body>
</html>
