<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teacher Sign Up - Radiation</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .container {
      max-width: 450px;
      margin: 50px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #9ca3af;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="box">

      <h1>Radiation</h1>

      <div class="subtitle">
        Teacher Sign Up
      </div>

      <form id="signupForm">

        <label>Teacher Name</label>

        <input
          type="text"
          id="teacherName"
          placeholder="আপনার নাম"
          required
        >


        <label>Email</label>

        <input
          type="email"
          id="email"
          placeholder="আপনার Email"
          required
        >


        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Password"
          minlength="6"
          required
        >


        <label>Confirm Password</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Password আবার লিখুন"
          minlength="6"
          required
        >


        <button
          type="submit"
          id="signupButton"
        >
          Teacher Sign Up
        </button>

      </form>


      <div
        class="message"
        id="message"
      ></div>


      <div class="login-link">

        Already have an account?

        <a href="teacher-login.html">
          Teacher Login
        </a>

      </div>

    </div>

  </div>


  <script>

    // Supabase connection

    const SUPABASE_URL =
      "https://yzgydftfucahiorefgoc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_KlqB07d1lFBHtaSf3dhCCg_XczOecCS";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // Sign Up

    document
      .getElementById("signupForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const name =
            document
              .getElementById("teacherName")
              .value
              .trim();


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          const password =
            document
              .getElementById("password")
              .value;


          const confirmPassword =
            document
              .getElementById("confirmPassword")
              .value;


          const message =
            document
              .getElementById("message");


          const button =
            document
              .getElementById("signupButton");


          // Password check

          if (password !== confirmPassword) {

            message.style.color = "red";

            message.innerText =
              "Password দুইটি একই নয়।";

            return;

          }


          button.disabled = true;

          button.innerText =
            "Creating Account...";


          // Supabase Sign Up

          const {
            data,
            error
          } = await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {

                full_name: name,

                role: "teacher"

              }

            }

          });


          if (error) {

            message.style.color = "red";

            message.innerText =
              error.message;

            button.disabled = false;

            button.innerText =
              "Teacher Sign Up";

            return;

          }


          message.style.color = "green";

          message.innerText =
            "Teacher account তৈরি হয়েছে।";


          // যেহেতু Email Confirmation OFF

          setTimeout(function() {

            window.location.href =
              "teacher-login.html";

          }, 1000);

        }
      );

  </script>

</body>
</html>
