  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 22px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 7px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 800px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    .live-status {
      padding: 14px;
      border-radius: 10px;
      background: #f3f4f6;
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
    }

    .live {
      background: #fee2e2;
      color: #b91c1c;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 13px;
      margin-top: 15px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .start-btn {
      background: #16a34a;
    }

    .stop-btn {
      background: #dc2626;
    }

    .logout-btn {
      background: #374151;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .teacher-name {
      font-size: 17px;
      margin-bottom: 5px;
    }

    .message {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Radiation</h1>
    <p>Teacher Dashboard</p>
  </div>

  <div class="container">

    <!-- Teacher Information -->
    <div class="card">
      <h2>Teacher Information</h2>

      <div class="teacher-name">
        Teacher:
        <strong id="teacherName">Loading...</strong>
      </div>

      <div>
        Email:
        <span id="teacherEmail">Loading...</span>
      </div>
    </div>


    <!-- Live Class -->
    <div class="card">

      <h2>Start Live Class</h2>

      <!-- Class -->
      <label for="classSelect">Class</label>

      <select id="classSelect" onchange="classChanged()">
        <option value="">Select Class</option>
        <option value="8">Class 8</option>
        <option value="9">Class 9</option>
        <option value="10">Class 10</option>
        <option value="11">Class 11</option>
        <option value="12">Class 12</option>
      </select>


      <!-- Group -->
      <div id="groupBox" style="display:none;">

        <label for="groupSelect">Group</label>

        <select id="groupSelect" onchange="groupChanged()">
          <option value="">Select Group</option>
          <option value="Science">Science</option>
          <option value="Arts">Arts</option>
          <option value="Commerce">Commerce</option>
        </select>

      </div>


      <!-- Subject -->
      <label for="subjectSelect">Subject</label>

      <select id="subjectSelect" onchange="subjectChanged()" disabled>
        <option value="">Select Subject</option>
      </select>


      <!-- Chapter -->
      <label for="chapterSelect">Chapter</label>

      <select id="chapterSelect" disabled>
        <option value="">Select Chapter</option>
      </select>


      <!-- Live Status -->
      <div class="live-status" id="liveStatus">
        ● Live Class বন্ধ
      </div>


      <!-- Buttons -->
      <button
        class="start-btn"
        id="startButton"
        onclick="startLive()"
        disabled>
        Start Live Class
      </button>

      <button
        class="stop-btn"
        id="stopButton"
        onclick="stopLive()"
        disabled>
        Stop Live Class
      </button>

      <div class="message" id="message"></div>

    </div>


    <!-- Logout -->
    <div class="card">

      <button
        class="logout-btn"
        onclick="logout()">
        Logout
      </button>

    </div>

  </div>

    window.supabase.createClient(

  ========================= */

  async function loadTeacher() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

      window.location.href =
        "teacher-login.html";

      return;
    }

    const role =
      user.user_metadata?.role;

    if (role !== "teacher") {

      await supabaseClient.auth.signOut();

      window.location.href =
        "teacher-login.html";

      return;
    }

    document.getElementById("teacherName")
      .innerText =
      user.user_metadata?.full_name ||
      "Teacher";

    document.getElementById("teacherEmail")
      .innerText =
      user.email || "";
  }

  /* =========================
     CLASS CHANGED
  ========================= */

  function classChanged() {

    const classValue =
      document.getElementById("classSelect").value;

    const groupBox =
      document.getElementById("groupBox");

    const groupSelect =
      document.getElementById("groupSelect");

    const subjectSelect =
      document.getElementById("subjectSelect");

    const chapterSelect =
      document.getElementById("chapterSelect");

    chapterSelect.innerHTML =
      '<option value="">Select Chapter</option>';

    chapterSelect.disabled = true;

    subjectSelect.innerHTML =
      '<option value="">Select Subject</option>';

    subjectSelect.disabled = true;

    document.getElementById("startButton")
      .disabled = true;


    if (!classValue) {

      groupBox.style.display = "none";

      return;
    }


    /* Class 8 */
    if (classValue === "8") {

      groupBox.style.display = "none";

      loadSubjects(
        subjects["8"]
      );

      return;
    }


    /* Class 9-12 */
    groupBox.style.display = "block";

    groupSelect.value = "";

  }


  /* =========================
     GROUP CHANGED
  ========================= */

  function groupChanged() {

    const classValue =
      document.getElementById("classSelect").value;

    const groupValue =
      document.getElementById("groupSelect").value;

    if (!groupValue) return;


    loadSubjects(
      subjects[classValue][groupValue]
    );
  }


  /* =========================
     LOAD SUBJECTS
  ========================= */

  function loadSubjects(subjectList) {

    const subjectSelect =
      document.getElementById("subjectSelect");

    subjectSelect.innerHTML =
      '<option value="">Select Subject</option>';


    subjectList.forEach(function(subject) {

      const option =
        document.createElement("option");

      option.value = subject;
      option.textContent = subject;

      subjectSelect.appendChild(option);

    });


    subjectSelect.disabled = false;

  }


  /* =========================
     SUBJECT CHANGED
  ========================= */

  function subjectChanged() {

    const classValue =
      document.getElementById("classSelect").value;

    const subjectValue =
      document.getElementById("subjectSelect").value;

    const chapterSelect =
      document.getElementById("chapterSelect");


    chapterSelect.innerHTML =
      '<option value="">Select Chapter</option>';

    document.getElementById("startButton")
      .disabled = true;


    if (!subjectValue) {

      chapterSelect.disabled = true;

      return;
    }


    /*
      আপাতত Mathematics-এর
      Class 8 chapter list দেওয়া হলো।
      পরের ধাপে প্রতিটি Subject-এর
      NCTB chapter list বসানো হবে।
    */

    if (
      classValue === "8" &&
      subjectValue === "গণিত"
    ) {

      const chapters = [

        "অধ্যায় ১ — প্যাটার্ন",
        "অধ্যায় ২ — মুনাফা",
        "অধ্যায় ৩ — পরিমাপ",
        "অধ্যায় ৪ — বীজগণিতীয় সূত্রাবলি ও প্রয়োগ",
        "অধ্যায় ৫ — বীজগণিতীয় ভগ্নাংশ",
        "অধ্যায় ৬ — সরল সহসমীকরণ",
        "অধ্যায় ৭ — সেট",
        "অধ্যায় ৮ — চতুর্ভুজ",
        "অধ্যায় ৯ — পিথাগোরাসের উপপাদ্য",
        "অধ্যায় ১০ — বৃত্ত",
        "অধ্যায় ১১ — তথ্য ও উপাত্ত"

      ];


      chapters.forEach(function(chapter, index) {

        const option =
          document.createElement("option");

        option.value = index + 1;

        option.textContent = chapter;

        chapterSelect.appendChild(option);

      });


      chapterSelect.disabled = false;

      return;
    }


    /*
      অন্য Subject-এর chapter
      পরের ধাপে যোগ করা হবে।
    */

    const option =
      document.createElement("option");

    option.value = "1";

    option.textContent =
      "Chapter list পরবর্তী ধাপে যোগ করা হবে";

    chapterSelect.appendChild(option);

    chapterSelect.disabled = false;

  }


  /* =========================
     START LIVE
  ========================= */

  function startLive() {

    const classValue =
      document.getElementById("classSelect").value;

    const groupValue =
      document.getElementById("groupSelect").value;

    const subjectValue =
      document.getElementById("subjectSelect").value;

    const chapterValue =
      document.getElementById("chapterSelect").value;


    if (!classValue ||
        !subjectValue ||
        !chapterValue) {

      document.getElementById("message")
        .innerText =
        "Class, Subject এবং Chapter নির্বাচন করুন।";

      return;
    }


    let text =
      "● LIVE — Class " +
      classValue;


    if (groupValue) {

      text +=
        " — " + groupValue;
    }


    text +=
      " — " +
      subjectValue +
      " — Chapter " +
      chapterValue;


    document.getElementById("liveStatus")
      .innerText = text;

    document.getElementById("liveStatus")
      .classList.add("live");


    document.getElementById("startButton")
      .disabled = true;

    document.getElementById("stopButton")
      .disabled = false;


    document.getElementById("classSelect")
      .disabled = true;

    document.getElementById("groupSelect")
      .disabled = true;

    document.getElementById("subjectSelect")
      .disabled = true;

    document.getElementById("chapterSelect")
      .disabled = true;


    document.getElementById("message")
      .style.color = "green";

    document.getElementById("message")
      .innerText =
      "Live Class চালু হয়েছে।";

  }


  /* =========================
     STOP LIVE
  ========================= */

  function stopLive() {

    document.getElementById("liveStatus")
      .innerText =
      "● Live Class বন্ধ";

    document.getElementById("liveStatus")
      .classList.remove("live");


    document.getElementById("startButton")
      .disabled = false;

    document.getElementById("stopButton")
      .disabled = true;


    document.getElementById("classSelect")
      .disabled = false;

    document.getElementById("groupSelect")
      .disabled = false;

    document.getElementById("subjectSelect")
      .disabled = false;

    document.getElementById("chapterSelect")
      .disabled = false;


    document.getElementById("message")
      .style.color = "#555";

    document.getElementById("message")
      .innerText =
      "Live Class বন্ধ হয়েছে।";

  }


  /* =========================
     LOGOUT

    await supabaseClient.auth.signOut();

      "teacher-login.html";

  /* =========================
